services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/#", "-C", "1", "-i", "hc", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  bme680:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bme680
    image: airq-sensor:latest
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    devices:
      - /dev/i2c-1:/dev/i2c-1
    environment:
      - TZ=${TZ:-UTC}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=sensors/bme680
      - SENSOR_TYPE=bme680
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.bme680-measure.schedule: "@every 1m"
      ofelia.job-exec.bme680-measure.command: "python /app/measure.py"

  owm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: owm
    image: airq-sensor:latest
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - TZ=${TZ:-UTC}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=sensors/owm
      - SENSOR_TYPE=owm
      - OWM_API_KEY=${OWM_API_KEY}
      - LATITUDE=${LATITUDE}
      - LONGITUDE=${LONGITUDE}
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.owm-measure.schedule: "@every 5m"
      ofelia.job-exec.owm-measure.command: "python /app/measure.py"

  sds011:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sds011
    image: airq-sensor:latest
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    environment:
      - TZ=${TZ:-UTC}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=sensors/sds011
      - SENSOR_TYPE=sds011
      - SDS011_PORT=/dev/ttyUSB0
      - WARM_UP_TIME=15
      - COLLECT_TIME=15
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.sds011-measure.schedule: "@every 10m"
      ofelia.job-exec.sds011-measure.no-overlap: "true"
      ofelia.job-exec.sds011-measure.command: "python /app/measure.py"

  mhz19:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mhz19
    image: airq-sensor:latest
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    devices:
      - /dev/ttyS0:/dev/ttyS0
    environment:
      - TZ=${TZ:-UTC}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=sensors/mhz19
      - SENSOR_TYPE=mhz19
      - MHZ19_PORT=/dev/ttyS0
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.mhz19-measure.schedule: "@every 1m"
      ofelia.job-exec.mhz19-measure.command: "python /app/measure.py"

  ofelia:
    image: ghcr.io/netresearch/ofelia:latest
    container_name: ofelia
    restart: unless-stopped
    depends_on:
      - bme680
      - owm
      - sds011
      - mhz19
    volumes:
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
    command: daemon --docker

volumes:
  mosquitto_data:
