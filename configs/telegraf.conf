# Telegraf configuration for AirQ hybrid setup
# Subscribes to Pi's MQTT broker and forwards to VictoriaMetrics

[global_tags]
  location = "home"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "airq-vps"
  omit_hostname = false

###############################################################################
#                            INPUT PLUGINS                                   #
###############################################################################

# MQTT input: Subscribe to all sensor topics
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER:mosquitto}:${MQTT_PORT:1883}"]
  topics = ["sensors/#"]

  # Authentication (optional, leave empty if no auth)
  # username = "user"
  # password = "pass"

  # Data format: JSON with optional field mapping
  data_format = "json"

  # Extract timestamp from JSON payload
  json_time_key = "timestamp"
  json_time_format = "2006-01-02T15:04:05Z07:00"

  # Parse topic to extract sensor name
  # sensors/bme680 → measurement="bme680"
  # This will create separate measurements per sensor
  measurement_name = "sensor_reading"

  # Optional: tag the source sensor from topic
  [inputs.mqtt_consumer.tags]
    source = "pi"

###############################################################################
#                            OUTPUT PLUGINS                                  #
###############################################################################

# VictoriaMetrics output (InfluxDB-compatible endpoint)
[[outputs.influxdb_v2]]
  urls = ["http://${VICTORIA_URL:victoria-metrics:8428}"]
  bucket = "airq"
  organization = "airq"

  # These are ignored by VictoriaMetrics but required by output plugin
  token = "airq-token"

  # Timeout and retry settings
  timeout = "5s"
  retention = "0"

###############################################################################
#                          PROCESSOR PLUGINS                                 #
###############################################################################

# Parse MQTT topic to extract sensor type
[[processors.regex]]
  namepass = ["sensor_reading"]

  [[processors.regex.tags]]
    key = "topic"
    pattern = "^sensors/(.+)$"
    replacement = "${1}"
    result_key = "sensor_type"

# Add static tags to all metrics
[[processors.add_tags]]
  [processors.add_tags.tags]
    environment = "production"
    system = "airq"
