[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  precision = "0s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = ["sensors/bme680"]
  name_override = "bme680"
  data_format = "json"
  json_time_key = "datetime"
  json_time_format = "2006-01-02T15:04:05.999999-07:00"

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = ["sensors/owm"]
  name_override = "owm"
  data_format = "json"
  json_string_fields = ["wind_direction", "status", "detailed_status"]
  json_time_key = "datetime"
  json_time_format = "2006-01-02T15:04:05.999999-07:00"

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = ["sensors/sds011"]
  name_override = "sds011"
  data_format = "json"
  json_time_key = "datetime"
  json_time_format = "2006-01-02T15:04:05.999999-07:00"

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = ["sensors/mhz19"]
  name_override = "mhz19"
  data_format = "json"
  json_time_key = "datetime"
  json_time_format = "2006-01-02T15:04:05.999999-07:00"

[[outputs.influxdb_v2]]
  urls = ["http://victoria-metrics:8428"]
  token = "unused"
  organization = "unused"
  bucket = "airq"
